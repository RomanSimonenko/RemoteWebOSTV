name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build from clean checkout
        run: pnpm build
      - name: Check types
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Install Chromium
        run: pnpm --filter @remote-webos-tv/web exec playwright install --with-deps chromium
      - name: Browser tests with synthetic TV
        run: pnpm --filter @remote-webos-tv/web test:e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload synthetic browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
